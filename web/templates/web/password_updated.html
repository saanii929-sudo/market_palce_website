{% extends "web/auth_base.html" %}
{% block title %}Password updated · SportTech{% endblock %}
{% block form_content %}
<div class="flex flex-col items-center text-center pt-10">
  <span class="w-16 h-16 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
    <svg viewBox="0 0 24 24" class="w-7 h-7"><use href="#icon-check"/></svg>
  </span>
  <h2 class="display text-3xl sm:text-4xl mt-6">Password updated</h2>
  <p class="mt-3 text-sm text-gray-500 max-w-xs">
    Your password has been changed. Use it next time you log in to SportTech.
  </p>
  <a href="{% url 'web-login' %}" class="mt-8 w-full rounded-xl bg-brand hover:bg-brand-dark text-white font-bold py-3.5 transition-colors text-center">
    Continue to login
  </a>
</div>
{% endblock %}
