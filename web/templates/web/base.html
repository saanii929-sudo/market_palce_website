{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SportTech{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Anton', 'sans-serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
        },
        colors: {
          ink: '#14161c',
          cream: '#f2ede3',
          brand: {
            DEFAULT: '#fb4e1f',
            dark: '#e0430f',
          },
        },
      },
    },
  }
</script>
<style>
  body { background-color: #f2ede3; }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .ring-decor { border: 1px solid rgba(251,78,31,0.25); border-radius: 9999px; position: absolute; }
  .ring-decor.dim { border-color: rgba(255,255,255,0.08); }
  ::placeholder { color: #9ca3af; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen text-ink antialiased pb-16 md:pb-0">
{% if messages %}
  <div class="fixed top-4 right-4 z-50 space-y-2">
    {% for message in messages %}
      <div class="rounded-lg px-4 py-3 text-sm font-medium shadow-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
