components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          description: e.g. Home, Office
          maxLength: 50
        recipient_name:
          type: string
          maxLength: 150
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
          maxLength: 20
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        is_default:
          type: boolean
      required:
      - city
      - id
      - line1
      - phone
      - recipient_name
    AvatarUpload:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        logo:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - logo
      - name
      - slug
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        coupon_code:
          type: string
          nullable: true
          readOnly: true
        coupon_error:
          type: string
          readOnly: true
          nullable: true
      required:
      - coupon_code
      - coupon_error
      - delivery_fee
      - discount_amount
      - items
      - subtotal
      - total
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
        variant:
          type: integer
          nullable: true
        variant_label:
          type: string
          nullable: true
          readOnly: true
        qty:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - product
      - product_name
      - product_slug
      - unit_price
      - variant_label
    CartItemAdd:
      type: object
      properties:
        product_id:
          type: integer
        variant_id:
          type: integer
          nullable: true
        qty:
          type: integer
          minimum: 1
          default: 1
      required:
      - product_id
    CartItemUpdate:
      type: object
      properties:
        qty:
          type: integer
          minimum: 1
      required:
      - qty
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          readOnly: true
          nullable: true
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
          readOnly: true
      required:
      - icon
      - id
      - name
      - slug
      - subcategories
    ChannelEnum:
