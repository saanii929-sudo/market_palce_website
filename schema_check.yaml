  /api/v1/catalog/categories/{slug}/products/:
    get:
      operationId: v1_catalog_categories_products_list
      description: |-
        Products scoped to one category via the URL, e.g.
        /catalog/categories/football/products/ - a dedicated alternative to
        /catalog/products/?category=football for clients that prefer a
        resource-nested URL over a query param.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
        description: Filter by brand slug.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: seller
        schema:
          type: string
        description: Filter by seller slug.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - newest
          - price_asc
          - price_desc
          - rating
        description: Sort order.
      - in: query
        name: subcategory
        schema:
          type: string
        description: Filter by subcategory slug.
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
